name: Import SOVAC photos

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  import:
    if: github.actor == 'catstopia-pixel' && startsWith(github.event.issue.title, '[SOVAC IMPORT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-dashboard
      - name: Download photos
        run: |
          mkdir -p public/sovac/2026
          curl -L --fail 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-56c8-820b-8816-c84b9f10576f/raw?se=2026-09-23T09%3A09%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=6ffa497e-e95d-5d80-b54b-7c0ebb06015d&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T04%3A12%3A21Z&ske=2026-09-24T04%3A12%3A21Z&sks=b&skv=2026-02-06&sig=BNr5%2FKuYm2WtxgYSqtonhJC80L%2FuNobWZX9y1zE3rOo%3D' -o public/sovac/2026/IMG_8649.jpg
          curl -L --fail 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0240-8209-9b28-8e1f249dc466/raw?se=2026-09-23T09%3A09%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=7b94db6d-30c2-5387-b0da-b24badf19ffc&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T00%3A22%3A44Z&ske=2026-09-24T00%3A22%3A44Z&sks=b&skv=2026-02-06&sig=e725tKih7BjxfGmLMix1S6RFWnhUwbEl5WbnQFn9dvg%3D' -o public/sovac/2026/IMG_8648.jpg
          curl -L --fail 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e890-81f5-a640-6598faba6187/raw?se=2026-09-23T09%3A09%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=7fce7773-c83f-54eb-bbb5-a5e4247e7c34&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T06%3A54%3A33Z&ske=2026-09-24T06%3A54%3A33Z&sks=b&skv=2026-02-06&sig=1ZV%2BAVzggsqqNxuTjJcEGn6nJzbrDIpNEpK7EO86nPU%3D' -o public/sovac/2026/IMG_8647.jpg
          curl -L --fail 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-2474-81f8-bc49-720dd592dac1/raw?se=2026-09-23T09%3A09%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=ed2cfe89-aaa3-5d71-a82d-6a1cab052487&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A04%3A29Z&ske=2026-09-24T01%3A04%3A29Z&sks=b&skv=2026-02-06&sig=2fI4EuR0msZRRRYFs7giIb1bo7SI8OgWye5fwvyCc9U%3D' -o public/sovac/2026/IMG_8646.jpg
          curl -L --fail 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7710-81f5-a484-483c02e61062/raw?se=2026-09-23T09%3A09%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d93279d2-dc2d-51de-810d-0007e9b92624&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T05%3A26%3A23Z&ske=2026-09-24T05%3A26%3A23Z&sks=b&skv=2026-02-06&sig=k3Or6VfUe1lxWdwkMSehjMpDvnUqqxAz59go4kgIceo%3D' -o public/sovac/2026/IMG_8650.jpg
          curl -L --fail 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-3080-81f6-a069-19a25142524c/raw?se=2026-09-23T09%3A09%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=8ab9ff70-2aa2-5068-85bd-cb98d6d6140a&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T03%3A13%3A30Z&ske=2026-09-24T03%3A13%3A30Z&sks=b&skv=2026-02-06&sig=nx1fjouAxbc5e2DAYL%2Fvpp2ZSfOVMsryZTQcz%2Fan1Hk%3D' -o public/sovac/2026/IMG_8571.jpg
          curl -L --fail 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5194-8211-bde5-5f9710f63ddc/raw?se=2026-09-23T09%3A09%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=1ad65fd6-deb6-5d9d-b374-812274fddfd0&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T07%3A49%3A01Z&ske=2026-09-24T07%3A49%3A01Z&sks=b&skv=2026-02-06&sig=EymhtJuralIiysFvhmxIpku2OA%2FqyP1IQYDbs3nuyD4%3D' -o public/sovac/2026/IMG_8556.jpg
      - name: Commit photos
        run: |
          git config user.name "LINKIMPACT Bot"
          git config user.email "catstopia@gmail.com"
          git add public/sovac/2026
          git commit -m "Add SOVAC 2026 activity photos"
          git push origin HEAD:cloudflare-dashboard
      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:"SOVAC activity photos imported."});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:"closed"});
