name: LINKIMPACT Form Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  test:
    if: github.actor == 'catstopia-pixel' && startsWith(github.event.issue.title, '[FORM TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Submit test application
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          body='{"slug":"wild-friends-2026","lang":"ko","date":"9월 25일(금) 오후 5:00","name":"TEST LINKIMPACT","age":"20대","gender":"응답하지 않음","phone":"010-0000-0000","device":"Apple / iPhone","interests":["NatureLens","미션 / 탐험"],"message":"자동 알림 및 신청폼 동작 확인을 위한 테스트 신청입니다.","consent":true}'
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST             -H "content-type: application/json"             --data "$body"             https://linkimpact.or.kr/api/forms/wild-friends-2026)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "body=$(tr '\n' ' ' < response.txt | head -c 1000)" >> "$GITHUB_OUTPUT"
          test "$code" = "200"
      - name: Comment result
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.submit.outputs.code }}
          BODY: ${{ steps.submit.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Live form test result: HTTP **${process.env.CODE}**\n\n\`\`\`text\n${process.env.BODY}\n\`\`\``
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
