name: LINKIMPACT Admin Access

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add, remove, or list"
        required: true
        type: choice
        options:
          - add
          - remove
          - list
      email:
        description: "Admin email (not required for list)"
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  manage-access:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' &&
       github.actor == 'catstopia-pixel' &&
       startsWith(github.event.issue.title, '[LINKIMPACT ADMIN]'))
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POLICY_NAME: LINKIMPACT Admin Allow

    steps:
      - name: Parse command
        id: command
        shell: bash
        env:
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_EMAIL: ${{ inputs.email }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ACTION="${DISPATCH_ACTION}"
            EMAIL="${DISPATCH_EMAIL}"
          else
            ACTION="$(printf '%s\n' "${ISSUE_BODY}" | sed -n 's/^action:[[:space:]]*//p' | head -n1 | tr '[:upper:]' '[:lower:]' | xargs)"
            EMAIL="$(printf '%s\n' "${ISSUE_BODY}" | sed -n 's/^email:[[:space:]]*//p' | head -n1 | tr '[:upper:]' '[:lower:]' | xargs)"
          fi

          case "${ACTION}" in
            add|remove|list) ;;
            *) echo "Invalid action: ${ACTION}"; exit 1 ;;
          esac

          if [[ "${ACTION}" != "list" ]]; then
            if ! [[ "${EMAIL}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[A-Za-z]{2,}$ ]]; then
              echo "Invalid email address"
              exit 1
            fi
          fi

          echo "action=${ACTION}" >> "${GITHUB_OUTPUT}"
          echo "email=${EMAIL}" >> "${GITHUB_OUTPUT}"

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_TOKEN:-}" ]] || { echo "Missing CLOUDFLARE_ACCESS_API_TOKEN"; exit 1; }
          [[ -n "${CF_ACCOUNT_ID:-}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Find policy and manage admin access
        id: manage
        shell: bash
        env:
          ACTION: ${{ steps.command.outputs.action }}
          EMAIL: ${{ steps.command.outputs.email }}
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json")

          cf_get() {
            curl -fsS "${AUTH[@]}" "$1"
          }

          cf_put() {
            curl -fsS -X PUT "${AUTH[@]}" --data-binary @"$2" "$1"
          }

          # Prefer a reusable policy with the exact configured name.
          REUSABLE="$(cf_get "${API}/accounts/${CF_ACCOUNT_ID}/access/policies?per_page=100")"
          POLICY_ID="$(jq -r --arg n "${POLICY_NAME}" '.result[]? | select(.name == $n) | .id' <<<"${REUSABLE}" | head -n1)"
          POLICY_KIND=""
          APP_ID=""

          if [[ -n "${POLICY_ID}" ]]; then
            POLICY_KIND="reusable"
            POLICY_JSON="$(cf_get "${API}/accounts/${CF_ACCOUNT_ID}/access/policies/${POLICY_ID}")"
          else
            APPS="$(cf_get "${API}/accounts/${CF_ACCOUNT_ID}/access/apps?per_page=100")"
            while IFS= read -r candidate_app_id; do
              [[ -n "${candidate_app_id}" ]] || continue
              POLICIES="$(cf_get "${API}/accounts/${CF_ACCOUNT_ID}/access/apps/${candidate_app_id}/policies?per_page=100")"
              candidate_policy_id="$(jq -r --arg n "${POLICY_NAME}" '.result[]? | select(.name == $n) | .id' <<<"${POLICIES}" | head -n1)"
              if [[ -n "${candidate_policy_id}" ]]; then
                APP_ID="${candidate_app_id}"
                POLICY_ID="${candidate_policy_id}"
                POLICY_KIND="application"
                POLICY_JSON="$(cf_get "${API}/accounts/${CF_ACCOUNT_ID}/access/apps/${APP_ID}/policies/${POLICY_ID}")"
                break
              fi
            done < <(jq -r '.result[]?.id' <<<"${APPS}")
          fi

          [[ -n "${POLICY_ID}" ]] || { echo "Policy not found: ${POLICY_NAME}"; exit 1; }

          CURRENT="$(jq -c '.result' <<<"${POLICY_JSON}")"
          CURRENT_EMAILS="$(jq -r '.include[]? | .email?.email // empty' <<<"${CURRENT}" | sort -fu)"

          if [[ "${ACTION}" == "list" ]]; then
            {
              echo "result<<EOF"
              if [[ -n "${CURRENT_EMAILS}" ]]; then
                printf '%s\n' "${CURRENT_EMAILS}"
              else
                echo "(no individual email rules)"
              fi
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Build a minimal valid update body while preserving existing policy settings.
          jq '
            {
              name,
              decision,
              include: (.include // []),
              exclude: (.exclude // []),
              require: (.require // []),
              approval_groups,
              approval_required,
              isolation_required,
              purpose_justification_prompt,
              purpose_justification_required,
              session_duration,
              precedence,
              mfa_config
            }
            | with_entries(select(.value != null))
          ' <<<"${CURRENT}" > policy-base.json

          if [[ "${ACTION}" == "add" ]]; then
            jq --arg email "${EMAIL}" '
              .include = (
                (.include // [])
                | if any(.[]; (.email?.email // "" | ascii_downcase) == ($email | ascii_downcase))
                  then .
                  else . + [{"email":{"email":$email}}]
                  end
              )
            ' policy-base.json > policy-update.json
          else
            jq --arg email "${EMAIL}" '
              .include = [
                (.include // [])[]
                | select((.email?.email // "" | ascii_downcase) != ($email | ascii_downcase))
              ]
            ' policy-base.json > policy-update.json
          fi

          if [[ "${POLICY_KIND}" == "reusable" ]]; then
            RESPONSE="$(cf_put "${API}/accounts/${CF_ACCOUNT_ID}/access/policies/${POLICY_ID}" policy-update.json)"
          else
            RESPONSE="$(cf_put "${API}/accounts/${CF_ACCOUNT_ID}/access/apps/${APP_ID}/policies/${POLICY_ID}" policy-update.json)"
          fi

          jq -e '.success == true' <<<"${RESPONSE}" >/dev/null || {
            jq '.errors' <<<"${RESPONSE}"
            exit 1
          }

          UPDATED_EMAILS="$(jq -r '.result.include[]? | .email?.email // empty' <<<"${RESPONSE}" | sort -fu)"
          {
            echo "result<<EOF"
            if [[ -n "${UPDATED_EMAILS}" ]]; then
              printf '%s\n' "${UPDATED_EMAILS}"
            else
              echo "(no individual email rules)"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Write summary
        shell: bash
        env:
          ACTION: ${{ steps.command.outputs.action }}
          EMAIL: ${{ steps.command.outputs.email }}
          RESULT: ${{ steps.manage.outputs.result }}
        run: |
          {
            echo "## LINKIMPACT Admin Access"
            echo
            echo "- Action: \`${ACTION}\`"
            if [[ -n "${EMAIL}" ]]; then
              echo "- Email: \`${EMAIL}\`"
            fi
            echo
            echo "### Individual email rules"
            echo '~~~text'
            printf '%s\n' "${RESULT}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment on command issue
        if: ${{ github.event_name == 'issues' }}
        uses: actions/github-script@v7
        env:
          ACTION: ${{ steps.command.outputs.action }}
          EMAIL: ${{ steps.command.outputs.email }}
          RESULT: ${{ steps.manage.outputs.result }}
        with:
          script: |
            const action = process.env.ACTION;
            const email = process.env.EMAIL;
            const result = process.env.RESULT;
            const verb = action === 'add' ? 'added' : action === 'remove' ? 'removed' : 'listed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Cloudflare Access command completed: **${verb}**${email ? ` \`${email}\`` : ''}.\n\nCurrent individual email rules:\n\`\`\`text\n${result}\n\`\`\``
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
